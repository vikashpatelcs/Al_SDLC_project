# Pure Agile Lifecycle Workflow per PS §15
model: "Agile"
phases:
  - phase_name: "Sprint Planning & Backlog Prioritization"
    activity: "User story definition, story estimation, and sprint backlog commitment"
    role: "Scrum Master & Product Owner"
    deliverable: "Committed sprint backlog"
    security_activity: "Basic security tag review on input validation"
    testing: "Test case acceptance criteria review"
    compliance_checkpoint: "Basic regulatory guidelines review"
    human_approval: "Product Owner approval on sprint scope"
    entry_criteria: "Prior sprint closed"
    exit_criteria: "Sprint backlog estimated and assigned"
    traceability_requirement: "Stories tagged with requirement category"

  - phase_name: "Sprint Execution & Daily Standups"
    activity: "Iterative development, peer testing, and daily standup synchronization"
    role: "Scrum Development Team"
    deliverable: "Potentially shippable product increment"
    security_activity: "Standard linter security rules"
    testing: "Unit testing and automated developer tests"
    compliance_checkpoint: "Code review compliance check"
    human_approval: "Developer code review sign-off"
    entry_criteria: "Sprint planning complete"
    exit_criteria: "Definition of Done satisfied for sprint stories"
    traceability_requirement: "Task commits linked to story IDs"

  - phase_name: "Sprint Review & Retrospective"
    activity: "Stakeholder demo, feature acceptance, and process retrospective"
    role: "Scrum Team & Business Stakeholders"
    deliverable: "Sprint review notes and deployment package"
    security_activity: "Basic vulnerability scan review"
    testing: "Demo scenario walkthrough"
    compliance_checkpoint: "Sprint compliance summary review"
    human_approval: "Product Owner sign-off on delivered increment"
    entry_criteria: "Increment deployed to demo environment"
    exit_criteria: "Increment accepted or moved to next backlog"
    traceability_requirement: "Demo acceptance logged against story IDs"
