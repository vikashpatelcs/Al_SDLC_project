# Agile + DevSecOps Hybrid Customized Financial Lifecycle Workflow per PS §15
model: "Agile + DevSecOps Hybrid"
phases:
  - phase_name: "Sprint Inception & Regulatory Scope"
    activity: "Backlog grooming, user story decomposition, and regulatory boundary definition"
    role: "Product Owner & Regulatory Compliance Officer"
    deliverable: "Sprint backlog with RFC-2119 user stories and compliance-tagged acceptance criteria"
    security_activity: "Threat modeling (STRIDE) and abuse case specification for new payment endpoints"
    testing: "Acceptance criteria review and automated test case scaffolding"
    compliance_checkpoint: "DPDP Act personal data audit and KYC statutory requirements validation"
    human_approval: "Product Owner and Compliance Officer sign-off on sprint story scope"
    entry_criteria: "Prior sprint retrospective completed; regulatory baseline confirmed"
    exit_criteria: "All user stories groomed with security tags and testable Given-When-Then criteria"
    traceability_requirement: "Bidirectional mapping from sprint stories to source regulatory circulars"

  - phase_name: "Iterative Construction & Shift-Left Security"
    activity: "Test-Driven Development (TDD), microservice coding, and peer code reviews"
    role: "Full-Stack Engineers & AppSec Specialist"
    deliverable: "Functional service containers, unit test suites, and OpenAPI specs"
    security_activity: "Automated pre-commit SAST scanning, dependency vulnerability check (Snyk), and secret linting"
    testing: "Unit testing (>85% coverage) and automated integration tests in ephemeral test harness"
    compliance_checkpoint: "PII masking inspection and verification of AES-256 envelope encryption"
    human_approval: "Peer senior engineer code review approval on all pull requests"
    entry_criteria: "Story technical architecture approved; development branches created"
    exit_criteria: "All unit tests passing; zero critical/high SAST defects; linting clean"
    traceability_requirement: "Git commit SHAs and PR links mapped to requirement and story IDs"

  - phase_name: "Automated DevSecOps Pipeline & System Verification"
    activity: "CI/CD automated deployment to staging, DAST security scanning, and ledger integration testing"
    role: "DevSecOps Engineer & QA Automation Lead"
    deliverable: "Staging deployment report, DAST vulnerability audit log, and performance metrics"
    security_activity: "Dynamic Application Security Testing (OWASP ZAP) and container image scanning (Trivy)"
    testing: "Transaction-integrity testing, concurrent double-spend simulations, and latency benchmarking"
    compliance_checkpoint: "RBI 5-year immutable WORM audit trail verification and session timeout check"
    human_approval: "Security Lead and QA Lead approval on test run and penetration test results"
    entry_criteria: "Successful build artifact publication to secure container registry"
    exit_criteria: "Zero open critical security issues; performance SLA (<200ms p99) met"
    traceability_requirement: "Automated test execution logs linked to requirement IDs"

  - phase_name: "Stage-Gate Compliance & Production Release"
    activity: "Canary deployment, operational readiness review, and regulatory audit pack generation"
    role: "Release Manager & Chief Information Security Officer (CISO)"
    deliverable: "Production release bundle, signed compliance certificate, and incident response runbook"
    security_activity: "Production secrets verification in HSM, TLS 1.3 cert check, and SOC 2 telemetry audit"
    testing: "Synthetic smoke tests in production environment and payment gateway health checks"
    compliance_checkpoint: "Statutory 4-role sign-off and Data Protection Officer consent register audit"
    human_approval: "Mandatory 4-role sign-off: Project Manager, Enterprise Architect, CISO, and Legal Officer"
    entry_criteria: "All pipeline stages green; compliance audit report signed"
    exit_criteria: "Production traffic 100% routed; monitoring alerts green; audit log active"
    traceability_requirement: "Complete end-to-end RTM exported to versioned PDF and archived"
