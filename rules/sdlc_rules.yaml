# Multi-Criteria Decision Analysis (MCDA) SDLC Rules and Weight Matrix per Problem Statement §13-§15 and Master Plan Phase 11
version: "1.0.0"

factors:
  requirement_stability:
    name: "Requirement Stability"
    description: "Degree to which scope and requirements are fixed vs fluid."
    scale_anchors:
      1: "Highly volatile; evolving weekly with new market insights"
      3: "Moderately stable; core scope defined, secondary features flexible"
      5: "Completely frozen; statutory or contractually fixed baseline"

  regulatory_criticality:
    name: "Regulatory Criticality"
    description: "Strictness of regulatory oversight, auditability, and statutory mandates."
    scale_anchors:
      1: "Unregulated or internal experimental utility"
      3: "Standard industry compliance guidelines"
      5: "Mission-critical financial regulation (strict RBI, PMLA, DPDP mandates)"

  security_risk:
    name: "Security Risk"
    description: "Potential severity of cybersecurity attack or fraudulent financial breach."
    scale_anchors:
      1: "Low; non-sensitive public information"
      3: "Moderate; authenticated user portal with encrypted data"
      5: "Critical; monetary movement, customer credentials, HSM keys, high fraud target"

  project_complexity:
    name: "Project Complexity"
    description: "Architectural, integration, and algorithmic intricacy."
    scale_anchors:
      1: "Simple standalone service with few integrations"
      3: "Moderate multi-tier architecture with standard database and REST APIs"
      5: "High distributed complexity; multi-rail payments, core banking ledger sync"

  system_size:
    name: "System Size"
    description: "Scale of system in terms of codebase, modules, and user base."
    scale_anchors:
      1: "Small module or microservice (< 5k LOC)"
      3: "Medium departmental banking platform (5k - 50k LOC)"
      5: "Enterprise-scale core system (> 50k LOC, millions of transactions)"

  legacy_system_dependence:
    name: "Legacy System Dependence"
    description: "Reliance on legacy mainframes, batch settlement, or monolithic databases."
    scale_anchors:
      1: "Greenfield modern cloud-native stack; zero legacy dependencies"
      3: "Standard integration with legacy core banking SOAP/REST adapters"
      5: "Deep bidirectional coupling with legacy mainframe and fixed-format flat files"

  frequency_of_expected_changes:
    name: "Frequency of Expected Changes"
    description: "Expected cadence of feature updates and scope modifications."
    scale_anchors:
      1: "Rare; system remains unchanged for years after sign-off"
      3: "Quarterly enhancements and scheduled maintenance releases"
      5: "Continuous; bi-weekly sprints or daily continuous feature updates"

  need_for_continuous_delivery:
    name: "Need for Continuous Delivery"
    description: "Requirement for automated deployment pipelines and rapid time-to-market."
    scale_anchors:
      1: "Scheduled manual release windows; no automated pipeline"
      3: "Weekly automated builds to staging environments"
      5: "Mandatory zero-downtime CI/CD continuous delivery to production"

  availability_of_stakeholders:
    name: "Availability of Stakeholders"
    description: "Access to business and compliance owners for continuous feedback."
    scale_anchors:
      1: "Distant or external; feedback available only at major milestone gates"
      3: "Regular review meetings bi-weekly"
      5: "Fully embedded, co-located product owners and compliance partners"

  testing_and_documentation_requirements:
    name: "Testing and Documentation Requirements"
    description: "Rigor of formal IEEE documentation, traceability, and test verification."
    scale_anchors:
      1: "Informal documentation; developer unit tests"
      3: "Standard test suites and architecture documentation"
      5: "Exhaustive formal verification, bidirectional RTM, statutory audit trail"

  budget_and_schedule_constraints:
    name: "Budget and Schedule Constraints"
    description: "Flexibility of budget and delivery timelines."
    scale_anchors:
      1: "Flexible research and development budget and open timelines"
      3: "Standard commercial project milestones and budget review"
      5: "Rigid fixed-price, fixed-deadline statutory compliance delivery date"

  need_for_formal_verification:
    name: "Need for Formal Verification"
    description: "Requirement for rigorous mathematical proofs and cryptographic verification."
    scale_anchors:
      1: "Standard functional quality assurance sufficient"
      3: "Performance profiling and penetration testing required"
      5: "Formal state-machine verification, HSM cryptographic validation, mathematical proofs"

  consequences_of_system_failure:
    name: "Consequences of System Failure"
    description: "Impact if the software system experiences critical production failure."
    scale_anchors:
      1: "Minor user inconvenience; easily recoverable"
      3: "Temporary localized business disruption; minor financial loss"
      5: "Catastrophic; systemic bank failure, regulatory sanction, criminal liability"

